<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AICHONG 付款跳转页预览</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: rgba(246, 255, 247, 0.94);
        background: linear-gradient(180deg, #07110c 0%, #020705 100%);
      }

      .payment-bridge {
        position: absolute;
        top: 47%;
        left: 50%;
        width: min(560px, calc(100vw - 48px));
        overflow: hidden;
        padding: 38px 34px 42px;
        border: 1px solid rgba(125, 201, 143, 0.28);
        border-radius: 26px;
        background:
          linear-gradient(180deg, rgba(31, 55, 38, 0.88), rgba(13, 24, 18, 0.94)),
          rgba(18, 34, 24, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36), 0 0 42px rgba(92, 236, 117, 0.1);
        transform: translate(-50%, -50%);
      }

      .payment-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .payment-brand {
        display: block;
        width: 150px;
        height: 30px;
        object-fit: contain;
        margin-bottom: 40px;
      }

      .payment-status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 28px;
        color: #66ec7a;
        font-size: 15px;
        font-weight: 500;
      }

      .payment-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(218, 233, 219, 0.24);
        border-top-color: #66ec7a;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }

      h1 {
        margin: 0 0 14px;
        color: #f7fff8;
        font-size: clamp(24px, 5.1vw, 35px);
        font-weight: 760;
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        max-width: 420px;
        margin: 18px 0 0;
        color: rgba(218, 233, 219, 0.72);
        font-size: 14px;
        font-weight: 400;
        line-height: 1.85;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 560px) {
        .payment-bridge {
          top: 45%;
          padding: 28px 24px;
          border-radius: 22px;
        }

        .payment-brand {
          width: 136px;
          height: 27px;
          margin-bottom: 32px;
        }

        p {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="payment-bridge" aria-live="polite">
      <div class="payment-content">
        <img class="payment-brand" src="/logo.svg" alt="AICHONG" />
        <h1>正在前往付款页面</h1>
        <div class="payment-status">
          <span class="payment-spinner" aria-hidden="true"></span>
          正在准备安全付款链接
        </div>
        <p>请在新打开的页面完成付款。<br />付款完成后，回到 AICHONG 查看任务状态。</p>
      </div>
    </main>
  </body>
</html>
